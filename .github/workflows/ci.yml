name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ops
          POSTGRES_DB: operation_agents
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ops -d operation_agents"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://ops:ops@localhost:5432/operation_agents
      WORKER_DATABASE_URL: postgres://ops_worker:ops_worker_ci@localhost:5432/operation_agents
      WEBHOOK_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
