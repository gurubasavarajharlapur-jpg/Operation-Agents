services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: operation-agents-db
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: operation_agents
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d operation_agents"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
